services:
  - type: web
    name: openclaw
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: OPENCLAW_STATE_DIR
        value: "./openclaw_data"
      - key: OPENCLAW_WORKSPACE_DIR
        value: "./workspace"
      - key: OPENCLAW_GATE_TOKEN
        generateValue: true
